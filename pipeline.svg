<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="How I ship: Discover, Requirements, Build, UAT, Launch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#1B3A4B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#39FF88" stop-opacity="1"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="190" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect width="1000" height="190" fill="url(#bg)"/>
    <text x="30" y="32" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#2C9CDB" letter-spacing="2">HOW I SHIP</text>

    <!-- connector -->
    <line x1="100" y1="85" x2="900" y2="85" stroke="#2C5364" stroke-width="3"/>
    <line x1="100" y1="85" x2="900" y2="85" stroke="#2C9CDB" stroke-width="3" stroke-dasharray="6 14" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- nodes -->
    <g>
      <circle cx="100" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="100" y="94" font-size="24">🔍</text>
      <text x="100" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Discover</text>
      <text x="100" y="160" font-size="12" fill="#9AA5B1">Users &amp; stakeholders</text>
    </g>
    <g>
      <circle cx="300" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="300" y="94" font-size="24">📝</text>
      <text x="300" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Requirements</text>
      <text x="300" y="160" font-size="12" fill="#9AA5B1">Stories &amp; specs</text>
    </g>
    <g>
      <circle cx="500" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="500" y="94" font-size="24">⚙️</text>
      <text x="500" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Build</text>
      <text x="500" y="160" font-size="12" fill="#9AA5B1">With engineering</text>
    </g>
    <g>
      <circle cx="700" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="700" y="94" font-size="24">✅</text>
      <text x="700" y="140" font-size="15" font-weight="700" fill="#FFFFFF">UAT</text>
      <text x="700" y="160" font-size="12" fill="#9AA5B1">Test to sign-off</text>
    </g>
    <g>
      <circle cx="900" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="900" y="94" font-size="24">🚀</text>
      <text x="900" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Launch</text>
      <text x="900" y="160" font-size="12" fill="#9AA5B1">Ship &amp; roll out</text>
    </g>

    <!-- travelling signal -->
    <circle cy="85" r="14" fill="url(#glow)" cx="100">
      <animate attributeName="cx" values="100;900;900" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cy="85" r="4" fill="#39FF88" cx="100">
      <animate attributeName="cx" values="100;900;900" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
