<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 235" width="1000" height="235" role="img" aria-label="How I ship: Discover, Requirements, Build, UAT, Launch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#1B3A4B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#39FF88" stop-opacity="1"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="235" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect width="1000" height="235" fill="url(#bg)"/>
    <text x="970" y="28" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#2C9CDB" letter-spacing="2">HOW I SHIP · FEATURE LIFECYCLE</text>
    <g transform="translate(0 45)">

    <!-- connector -->
    <line x1="100" y1="85" x2="900" y2="85" stroke="#2C5364" stroke-width="3"/>
    <line x1="100" y1="85" x2="900" y2="85" stroke="#2C9CDB" stroke-width="3" stroke-dasharray="6 14" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- nodes -->
    <g>
      <circle cx="100" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="100" y="94" font-size="24">🔍</text>
      <text x="100" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Discover</text>
      <text x="100" y="160" font-size="12" fill="#9AA5B1">Users &amp; stakeholders</text>
    </g>
    <g>
      <circle cx="300" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="300" y="94" font-size="24">📝</text>
      <text x="300" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Requirements</text>
      <text x="300" y="160" font-size="12" fill="#9AA5B1">Stories &amp; specs</text>
    </g>
    <g>
      <circle cx="500" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="500" y="94" font-size="24">⚙️</text>
      <text x="500" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Build</text>
      <text x="500" y="160" font-size="12" fill="#9AA5B1">With engineering</text>
    </g>
    <g>
      <circle cx="700" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="700" y="94" font-size="24">✅</text>
      <text x="700" y="140" font-size="15" font-weight="700" fill="#FFFFFF">UAT</text>
      <text x="700" y="160" font-size="12" fill="#9AA5B1">Test to sign-off</text>
    </g>
    <g>
      <circle cx="900" cy="85" r="32" fill="none" stroke="#39FF88" stroke-width="3" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.4;1" dur="6s" begin="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="85" r="27" fill="#0F2027" stroke="#2C9CDB" stroke-width="2"/>
      <text x="900" y="94" font-size="24">🚀</text>
      <text x="900" y="140" font-size="15" font-weight="700" fill="#FFFFFF">Launch</text>
      <text x="900" y="160" font-size="12" fill="#9AA5B1">Ship &amp; roll out</text>
    </g>

    <!-- rocket launch at the end -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.81;0.95;0.97;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -150;0 -150" keyTimes="0;0.8;0.97;1" dur="6s" repeatCount="indefinite"/>
      <text x="930" y="100" font-size="22">🚀</text>
      <circle cx="942" cy="104" r="3" fill="#FFB020" opacity="0.8"/><circle cx="944" cy="112" r="2" fill="#FFE27A" opacity="0.6"/>
    </g>
    <g fill="#39FF88" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.82;0.95;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="880" cy="60" r="3"/><circle cx="920" cy="58" r="2.5" fill="#FFB020"/><circle cx="900" cy="48" r="2"/><circle cx="870" cy="75" r="2" fill="#2C9CDB"/><circle cx="930" cy="72" r="3" fill="#FFE27A"/>
    </g>

    <!-- robot carrying the feature card -->
    <g transform="translate(100 47)">
      <animateTransform attributeName="transform" type="translate" values="100 47;900 47;900 47" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.6s" repeatCount="indefinite"/>
        <g transform="scale(0.75)">
        <g><animateTransform attributeName="transform" type="rotate" values="20 -5 -11;-20 -5 -11;20 -5 -11" dur="0.6s" repeatCount="indefinite"/><rect x="-8" y="-11" width="6" height="11" rx="2.5" fill="#B8C2CC"/><rect x="-9" y="-2" width="8" height="3" rx="1.5" fill="#0B1622"/></g><g><animateTransform attributeName="transform" type="rotate" values="-20 5 -11;20 5 -11;-20 5 -11" dur="0.6s" repeatCount="indefinite"/><rect x="2" y="-11" width="6" height="11" rx="2.5" fill="#B8C2CC"/><rect x="1" y="-2" width="8" height="3" rx="1.5" fill="#0B1622"/></g><line x1="-10" y1="-26" x2="-15" y2="-46" stroke="#B8C2CC" stroke-width="4" stroke-linecap="round"/><line x1="10" y1="-26" x2="15" y2="-46" stroke="#B8C2CC" stroke-width="4" stroke-linecap="round"/>
        <rect x="-11" y="-30" width="22" height="20" rx="6" fill="#2C5364"/>
        <circle cx="0" cy="-19" r="2.5" fill="#39FF88"/>
        <rect x="-13" y="-51" width="26" height="22" rx="10" fill="#E8EEF4"/>
        <rect x="-10" y="-46" width="20" height="11" rx="5.5" fill="#0B1622"/>
        <ellipse cx="-4" cy="-40" rx="2.2" ry="2.2" fill="#39E6FF"><animate attributeName="ry" values="2.2;2.2;0.3;2.2" keyTimes="0;0.88;0.94;1" dur="3s" repeatCount="indefinite"/></ellipse><ellipse cx="4" cy="-40" rx="2.2" ry="2.2" fill="#39E6FF"><animate attributeName="ry" values="2.2;2.2;0.3;2.2" keyTimes="0;0.88;0.94;1" dur="3s" repeatCount="indefinite"/></ellipse>
        <rect x="-17" y="-45" width="5" height="9" rx="2.5" fill="#2C9CDB"/>
        <rect x="12" y="-45" width="5" height="9" rx="2.5" fill="#2C9CDB"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.19;0.2;1" dur="6s" repeatCount="indefinite"/>
          <rect x="-46" y="-72" width="92" height="22" rx="6" fill="#FFE27A" stroke="#0B1622" stroke-width="1.5"/>
          <text x="0" y="-57" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1622">💡 Idea</text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.39;0.4;1" dur="6s" repeatCount="indefinite"/>
          <rect x="-46" y="-72" width="92" height="22" rx="6" fill="#CFE0F5" stroke="#0B1622" stroke-width="1.5"/>
          <text x="0" y="-57" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1622">📝 User story</text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.41;0.59;0.6;1" dur="6s" repeatCount="indefinite"/>
          <rect x="-46" y="-72" width="92" height="22" rx="6" fill="#7CC4EE" stroke="#0B1622" stroke-width="1.5"/>
          <text x="0" y="-57" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1622">⌨️ In build</text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.61;0.79;0.8;1" dur="6s" repeatCount="indefinite"/>
          <rect x="-46" y="-72" width="92" height="22" rx="6" fill="#FFB020" stroke="#0B1622" stroke-width="1.5"/>
          <text x="0" y="-57" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1622">🧪 Testing</text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.81;1" dur="6s" repeatCount="indefinite"/>
          <rect x="-46" y="-72" width="92" height="22" rx="6" fill="#39FF88" stroke="#0B1622" stroke-width="1.5"/>
          <text x="0" y="-57" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1622">🚀 Shipped!</text></g>
        </g>
      </g>
    </g>
  </g>
  </g>
</svg>