<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Journey: 2023 Data Labeller at Tapway, 2025 Product Engineer at UCar-e, 2026 Project Executive at Tapway, next Technical PM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#1B3A4B"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C9CDB"/>
      <stop offset="1" stop-color="#39FF88"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="250" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1000" height="250" fill="url(#bg)"/>

    <!-- road -->
    <rect x="30" y="150" width="940" height="38" rx="19" fill="#0A121A"/>
    <line x1="50" y1="169" x2="950" y2="169" stroke="#F2C94C" stroke-width="2.5" stroke-dasharray="18 16" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="1s" repeatCount="indefinite"/>
    </line>
    <!-- progress glow -->
    <rect x="30" y="186" height="3" rx="1.5" fill="url(#prog)" width="0">
      <animate attributeName="width" values="0;940;940" keyTimes="0;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- milestone 1 -->
    <g text-anchor="middle">
      <text x="130" y="52" font-size="22" font-weight="700" fill="#2C9CDB">2023</text>
      <text x="130" y="80" font-size="15" font-weight="700" fill="#FFFFFF">Data Labeller</text>
      <text x="130" y="100" font-size="13" fill="#CFE0F5">Tapway</text>
      <line x1="130" y1="112" x2="130" y2="160" stroke="#2C5364" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="130" cy="169" r="9" fill="none" stroke="#2C9CDB" stroke-width="2">
        <animate attributeName="r" values="9;24" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="169" r="8" fill="#2C9CDB" stroke="#FFFFFF" stroke-width="2"/>
      <text x="130" y="220" font-size="12" fill="#9AA5B1" font-family="Consolas, 'Courier New', monospace">40K+ annotations</text>
    </g>

    <!-- milestone 2 -->
    <g text-anchor="middle">
      <text x="380" y="52" font-size="22" font-weight="700" fill="#2C9CDB">2025</text>
      <text x="380" y="80" font-size="15" font-weight="700" fill="#FFFFFF">Product Engineer / Asst. PM</text>
      <text x="380" y="100" font-size="13" fill="#CFE0F5">UCar-e by Perodua</text>
      <line x1="380" y1="112" x2="380" y2="160" stroke="#2C5364" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="380" cy="169" r="9" fill="none" stroke="#2C9CDB" stroke-width="2">
        <animate attributeName="r" values="9;24" dur="2s" begin="0.66s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.66s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="169" r="8" fill="#2C9CDB" stroke="#FFFFFF" stroke-width="2"/>
      <text x="380" y="220" font-size="12" fill="#9AA5B1" font-family="Consolas, 'Courier New', monospace">Requirements · UAT · Launch</text>
    </g>

    <!-- milestone 3 -->
    <g text-anchor="middle">
      <text x="630" y="52" font-size="22" font-weight="700" fill="#2C9CDB">2026</text>
      <text x="630" y="80" font-size="15" font-weight="700" fill="#FFFFFF">Project Executive</text>
      <text x="630" y="100" font-size="13" fill="#CFE0F5">Tapway</text>
      <line x1="630" y1="112" x2="630" y2="160" stroke="#2C5364" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="630" cy="169" r="9" fill="none" stroke="#2C9CDB" stroke-width="2">
        <animate attributeName="r" values="9;24" dur="2s" begin="1.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" begin="1.33s" repeatCount="indefinite"/>
      </circle>
      <circle cx="630" cy="169" r="8" fill="#2C9CDB" stroke="#FFFFFF" stroke-width="2"/>
      <text x="630" y="220" font-size="12" fill="#9AA5B1" font-family="Consolas, 'Courier New', monospace">CV projects end to end</text>
    </g>

    <!-- next -->
    <g text-anchor="middle">
      <text x="880" y="52" font-size="22" font-weight="700" fill="#39FF88">NEXT
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="880" y="80" font-size="15" font-weight="700" fill="#FFFFFF">Technical PM</text>
      <text x="880" y="100" font-size="13" fill="#CFE0F5">Your team? 👀</text>
      <line x1="880" y1="112" x2="880" y2="160" stroke="#39FF88" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <circle cx="880" cy="169" r="9" fill="#0A121A" stroke="#39FF88" stroke-width="2" stroke-dasharray="4 3">
        <animateTransform attributeName="transform" type="rotate" from="0 880 169" to="360 880 169" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text x="880" y="220" font-size="12" fill="#39FF88" font-family="Consolas, 'Courier New', monospace">open to remote roles</text>
    </g>

    <!-- career mode: level-ups as the car passes -->
    <text x="30" y="26" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#2C9CDB" letter-spacing="2">CAREER MODE · PLAYER: RASHEAD</text>
    <circle cx="130" cy="169" r="8" fill="#39FF88" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.925;0.935;1" dur="8s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.14;0.2;1" dur="8s" begin="0.45s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 -14" keyTimes="0;0.18;1" dur="8s" begin="0.45s" repeatCount="indefinite"/>
      <rect x="142" y="126" width="62" height="18" rx="9" fill="#39FF88"/>
      <text x="173" y="139" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#0B1622">LVL 1 ✓</text>
    </g>
    <circle cx="380" cy="169" r="8" fill="#39FF88" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.666;0.676;1" dur="8s" begin="2.52s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.14;0.2;1" dur="8s" begin="2.52s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 -14" keyTimes="0;0.18;1" dur="8s" begin="2.52s" repeatCount="indefinite"/>
      <rect x="392" y="126" width="62" height="18" rx="9" fill="#39FF88"/>
      <text x="423" y="139" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#0B1622">LVL 2 ✓</text>
    </g>
    <circle cx="630" cy="169" r="8" fill="#39FF88" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.409;0.419;1" dur="8s" begin="4.58s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.14;0.2;1" dur="8s" begin="4.58s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 -14" keyTimes="0;0.18;1" dur="8s" begin="4.58s" repeatCount="indefinite"/>
      <rect x="642" y="126" width="62" height="18" rx="9" fill="#39FF88"/>
      <text x="673" y="139" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#0B1622">LVL 3 ✓</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.14;0.2;1" dur="8s" begin="6.65s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 -14" keyTimes="0;0.18;1" dur="8s" begin="6.65s" repeatCount="indefinite"/>
      <rect x="760" y="126" width="104" height="18" rx="9" fill="#FFB020"/>
      <text x="812" y="139" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#0B1622">LEVEL UP? 🎮</text>
    </g>

    <!-- waving robot -->
    <g transform="translate(948 150) scale(0.9)">
      <g>
        <g><rect x="-8" y="-11" width="6" height="11" rx="2.5" fill="#B8C2CC"/><rect x="-9" y="-2" width="8" height="3" rx="1.5" fill="#0B1622"/></g><g><rect x="2" y="-11" width="6" height="11" rx="2.5" fill="#B8C2CC"/><rect x="1" y="-2" width="8" height="3" rx="1.5" fill="#0B1622"/></g>
        <g><line x1="-10" y1="-26" x2="-14" y2="-14" stroke="#B8C2CC" stroke-width="4" stroke-linecap="round"/><circle cx="-14" cy="-13" r="2.6" fill="#E8EEF4"/></g><g><animateTransform attributeName="transform" type="rotate" values="-150 10 -26;-105 10 -26;-150 10 -26" dur="0.8s" repeatCount="indefinite"/><line x1="10" y1="-26" x2="14" y2="-14" stroke="#B8C2CC" stroke-width="4" stroke-linecap="round"/><circle cx="14" cy="-13" r="2.6" fill="#E8EEF4"/></g>
        <rect x="-11" y="-30" width="22" height="20" rx="6" fill="#2C5364"/>
        <path d="M-6 -30 Q0 -24 6 -30" fill="none" stroke="#1B3A4B" stroke-width="2"/>
        <circle cx="0" cy="-19" r="2.5" fill="#39FF88"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
        <line x1="0" y1="-50" x2="0" y2="-57" stroke="#B8C2CC" stroke-width="1.8"/>
        <circle cx="0" cy="-58" r="2.6" fill="#FF4D4D"><animate attributeName="opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite"/></circle>
        <rect x="-13" y="-51" width="26" height="22" rx="10" fill="#E8EEF4"/>
        <rect x="-10" y="-46" width="20" height="11" rx="5.5" fill="#0B1622"/>
        <ellipse cx="-4" cy="-40" rx="2.2" ry="2.2" fill="#39E6FF"><animate attributeName="ry" values="2.2;2.2;0.3;2.2" keyTimes="0;0.88;0.94;1" dur="3s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="4" cy="-40" rx="2.2" ry="2.2" fill="#39E6FF"><animate attributeName="ry" values="2.2;2.2;0.3;2.2" keyTimes="0;0.88;0.94;1" dur="3s" repeatCount="indefinite"/></ellipse>
        <path d="M-14 -44 Q-14 -55 0 -55 Q14 -55 14 -44" fill="none" stroke="#2C9CDB" stroke-width="2.5"/>
        <rect x="-17" y="-45" width="5" height="9" rx="2.5" fill="#2C9CDB"/>
        <rect x="12" y="-45" width="5" height="9" rx="2.5" fill="#2C9CDB"/>
      </g>
    </g>
    <g transform="translate(948 62)">
      <rect x="-30" y="-14" width="52" height="20" rx="8" fill="#39FF88"/>
      <path d="M-6 6 L0 13 L4 6 Z" fill="#39FF88"/>
      <text x="-4" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#0B1622">Hi! 👋</text>
      <animateTransform attributeName="transform" type="translate" values="948 62;948 58;948 62" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- car -->
    <g transform="translate(10 150)">
      <animateTransform attributeName="transform" type="translate" values="10 150;880 150;880 150" keyTimes="0;0.9;1" dur="8s" repeatCount="indefinite"/>
      <g transform="scale(0.55)">
        <path d="M2 28 L2 16 Q2 10 8 10 L18 9 L30 -9 Q33 -12 38 -12 L66 -12 Q71 -12 75 -8 L92 8 L112 11 Q120 12 120 20 L120 28 Q120 32 116 32 L6 32 Q2 32 2 28 Z" fill="#39FF88"/>
        <path d="M2 24 L120 24 L120 28 Q120 32 116 32 L6 32 Q2 32 2 28 Z" fill="#22C46A"/>
        <path d="M22 8 L32 -8 L46 -8 L46 8 Z" fill="#0B1622" opacity="0.8"/>
        <path d="M50 8 L50 -8 L67 -8 L84 8 Z" fill="#0B1622" opacity="0.8"/>
        <path d="M112 12 L119 14 L119 18 L112 17 Z" fill="#FFE27A"/>
        <rect x="2" y="12" width="5" height="6" rx="1.5" fill="#FF4D4D"/>
        <circle cx="28" cy="32" r="11.5" fill="#0B0F14"/><circle cx="28" cy="32" r="5.5" fill="#B8C2CC"/>
        <circle cx="94" cy="32" r="11.5" fill="#0B0F14"/><circle cx="94" cy="32" r="5.5" fill="#B8C2CC"/>
      </g>
    </g>
  </g>
</svg>
