<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Rasheaduzzaman — Technical Product and Project Management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="0.55" stop-color="#14303F"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2C9CDB" stroke-opacity="0.09"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE27A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFE27A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- twinkling data points -->
    <g fill="#CFE0F5">
      <circle cx="90" cy="70" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="150" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="80" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="160" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="50" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- campus skyline -->
    <path d="M0 236 V206 H38 V190 H72 V210 H110 V176 H128 V168 H146 V176 H164 V204 H210 V192 H246 V214 H300 V186 H340 V200 H390 V212 H610 V198 H650 V180 H690 V206 H740 V172 H760 V160 H780 V172 H800 V200 H850 V188 H890 V210 H930 V194 H1000 V236 Z" fill="#0B1622" opacity="0.6"/>

    <!-- road -->
    <rect y="236" width="1000" height="64" fill="#0A121A"/>
    <line x1="0" y1="237.5" x2="1000" y2="237.5" stroke="#2C5364" stroke-width="2"/>
    <line x1="0" y1="282" x2="1000" y2="282" stroke="#F2C94C" stroke-width="3" stroke-dasharray="30 24" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-54" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- CV scanline -->
    <rect x="0" width="1000" height="70" fill="url(#scan)">
      <animate attributeName="y" values="-70;300" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- camera frame corners -->
    <g stroke="#39FF88" stroke-width="2.5" fill="none" opacity="0.8">
      <path d="M18 52 V18 H52"/>
      <path d="M948 18 H982 V52"/>
    </g>

    <!-- HUD -->
    <circle cx="34" cy="34" r="5" fill="#FF4D4D">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="46" y="38" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#CFE0F5" opacity="0.85">REC · CAM-01 · SMART CAMPUS</text>
    <text x="966" y="38" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#CFE0F5" opacity="0.85">FPS 30 · TRACKING 1 · KL, MY</text>

    <!-- title -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
      <text x="500" y="100" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="1">Rasheaduzzaman</text>
      <text x="500" y="134" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#CFE0F5">Technical Product &amp; Project Management</text>
      <text x="500" y="160" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#2C9CDB" letter-spacing="2">AI · COMPUTER VISION · SMART MOBILITY</text>
    </g>

    <!-- car with live detection box -->
    <g transform="translate(420 222)">
      <animateTransform attributeName="transform" type="translate" values="-200 222;1200 222" dur="9s" repeatCount="indefinite"/>
      <polygon points="112,10 200,-6 200,34" fill="url(#beam)"/>
      <ellipse cx="58" cy="43" rx="56" ry="4" fill="#000" opacity="0.45"/>
      <path d="M4 18 Q4 6 16 6 L30 6 L44 -14 Q47 -18 52 -18 L80 -18 Q86 -18 90 -13 L104 6 Q112 7 112 16 L112 28 Q112 32 108 32 L8 32 Q4 32 4 28 Z" fill="#2C9CDB"/>
      <path d="M36 4 L48 -12 L64 -12 L64 4 Z" fill="#CFE0F5" opacity="0.85"/>
      <path d="M68 4 L68 -12 L82 -12 L96 4 Z" fill="#CFE0F5" opacity="0.85"/>
      <line x1="66" y1="8" x2="66" y2="30" stroke="#1F7FB6" stroke-width="1.5"/>
      <rect x="104" y="10" width="8" height="5" rx="2" fill="#FFE27A"/>
      <rect x="4" y="10" width="5" height="6" rx="1.5" fill="#FF4D4D"/>
      <g transform="translate(28 32)">
        <circle r="11" fill="#111"/>
        <circle r="5.5" fill="#9AA5B1"/>
        <g stroke="#111" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.5s" repeatCount="indefinite"/>
          <line x1="-5" y1="0" x2="5" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/>
        </g>
      </g>
      <g transform="translate(88 32)">
        <circle r="11" fill="#111"/>
        <circle r="5.5" fill="#9AA5B1"/>
        <g stroke="#111" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.5s" repeatCount="indefinite"/>
          <line x1="-5" y1="0" x2="5" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/>
        </g>
      </g>
      <!-- detection box -->
      <rect x="-10" y="-30" width="134" height="78" rx="3" fill="#39FF88" fill-opacity="0.06" stroke="#39FF88" stroke-width="2"/>
      <rect x="-10" y="-48" width="120" height="18" fill="#39FF88"/>
      <text x="-4" y="-35" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#0B1622">car 0.98 · ID 01</text>
    </g>
  </g>
</svg>
